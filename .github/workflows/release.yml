name: Release

on:
  # Manual "Release" button. Publishes for the computed version below - the
  # only way to cut a release without pushing a tag first.
  workflow_dispatch:
  # Tag-driven: pushing a v1.0.* tag cuts the release for that tag. The tag
  # name IS the version, so nothing is computed on this path. v1.1.0 and
  # v2.0.0 do not match and will not publish.
  push:
    tags: ['v1.0.*']

permissions:
  contents: write

# Resolve the version. The normal path is a v1.0.* tag push, where the tag name
# IS the version - nothing is computed. Only a manual run has no tag, and there
# the version is computed as v1.0.<yyyymmdd>.<commit-count>-<short-sha-7>,
# e.g. v1.0.20260916.1234-a1b2c3d.
# Shared by both jobs via $GITHUB_ENV.
env:
  VERSION_SCRIPT: |
    if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
      echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
    else
      DATE="$(date -u +%Y%m%d)"
      COUNT="$(git rev-list --count HEAD)"
      SHA="$(git rev-parse --short=7 HEAD)"
      echo "VERSION=v1.0.${DATE}.${COUNT}-${SHA}" >> "$GITHUB_ENV"
    fi

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: 386, ext: '' }
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: linux, goarch: loong64, ext: '' }
          - { goos: linux, goarch: riscv64, ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
          - { goos: freebsd, goarch: amd64, ext: '' }
          - { goos: android, goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
          - { goos: windows, goarch: arm64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so `git rev-list --count HEAD` is meaningful.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Compute version
        run: ${{ env.VERSION_SCRIPT }}

      # The binary is published as a release asset directly, with no wrapper
      # archive. The filename already carries the version, GOOS and GOARCH, so
      # the asset name is self-describing and there is nothing to unpack.
      - name: Build
        run: |
          mkdir -p dist
          BINARY="icmp_custom-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/${BINARY}" \
            .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute version
        run: ${{ env.VERSION_SCRIPT }}

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > checksums-sha256.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${VERSION}"
          # Idempotent: if a release for this tag already exists (a re-run of
          # the same tag push, or a release created from the UI/API), just
          # (re)upload the assets instead of failing with "a release with the
          # same tag name already exists".
          #
          # On the tag-push path the tag already exists, so this only creates
          # the release. A manual run has no tag, and there `gh release
          # create` creates it too.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets."
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" \
              --title "icmp_custom ${TAG}" \
              --generate-notes \
              dist/*
          fi
