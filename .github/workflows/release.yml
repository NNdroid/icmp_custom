name: Release

on:
  # Manual "Release" button. Auto-computes the version (see below) and publishes.
  workflow_dispatch:
  # Every merge/push to main also auto-publishes a release with the computed
  # version. Remove this block if you do NOT want a release per commit.
  push:
    branches: [main]

permissions:
  contents: write

# Compute the version string: v1.0.<yyyymmdd>.<commit-count>-<short-sha-7>
# e.g. v1.0.20260916.1234-a1b2c3d
# Shared by both jobs via $GITHUB_ENV.
env:
  VERSION_SCRIPT: |
    DATE="$(date -u +%Y%m%d)"
    COUNT="$(git rev-list --count HEAD)"
    SHA="$(git rev-parse --short=7 HEAD)"
    echo "VERSION=v1.0.${DATE}.${COUNT}-${SHA}" >> "$GITHUB_ENV"

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: 386, ext: '' }
          - { goos: linux, goarch: amd64, ext: '' }
          - { goos: linux, goarch: arm, ext: '' }
          - { goos: linux, goarch: arm64, ext: '' }
          - { goos: linux, goarch: loong64, ext: '' }
          - { goos: linux, goarch: riscv64, ext: '' }
          - { goos: darwin, goarch: amd64, ext: '' }
          - { goos: darwin, goarch: arm64, ext: '' }
          - { goos: freebsd, goarch: amd64, ext: '' }
          - { goos: android, goarch: arm64, ext: '' }
          - { goos: windows, goarch: amd64, ext: '.exe' }
          - { goos: windows, goarch: arm64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history needed so `git rev-list --count HEAD` is meaningful.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Compute version
        run: ${{ env.VERSION_SCRIPT }}

      - name: Build
        run: |
          BINARY="icmp_custom${{ matrix.ext }}"
          mkdir -p "dist/icmp_custom-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${VERSION} -X main.commit=${GITHUB_SHA} -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o "dist/icmp_custom-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}/${BINARY}" \
            .
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0

      - name: Archive (zip on Windows, tar.gz elsewhere)
        run: |
          NAME="icmp_custom-${VERSION}-${{ matrix.goos }}-${{ matrix.goarch }}"
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip -r "${NAME}.zip" "${NAME}"
          else
            tar -czf "${NAME}.tar.gz" "${NAME}"
          fi
          rm -rf "${NAME}"

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compute version
        run: ${{ env.VERSION_SCRIPT }}

      - name: Generate SHA-256 checksums
        run: |
          cd dist
          sha256sum * > checksums-sha256.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${VERSION}"
          # Idempotent: if a release with this computed tag already exists
          # (re-run, or created from the UI/API), just (re)upload the assets
          # instead of failing with "a release with the same tag name already
          # exists". `gh release create` also auto-creates the git tag.
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists; uploading assets."
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" \
              --title "icmp_custom ${TAG}" \
              --generate-notes \
              dist/*
          fi
