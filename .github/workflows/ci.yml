name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (gofmt + vet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: gofmt (no diff allowed)
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            gofmt -d .
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }}, ${{ matrix.go }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.26.x', 'stable']
        exclude:
          - os: macos-latest
            go: 'stable'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Build
        run: go build -v ./...
      # The full suite runs on the in-memory fake transport by design, so no
      # root / CAP_NET_RAW is needed anywhere in CI.
      - name: Test (race + coverage)
        shell: bash
        run: |
          set -o pipefail
          go test -race -count=1 -coverprofile=coverage.txt -covermode=atomic ./... 2>&1 | tee test-output.txt
      - name: Upload test output (always, for post-mortem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-output-${{ matrix.os }}-${{ matrix.go }}
          path: test-output.txt
          if-no-files-found: ignore
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.go }}
          path: coverage.txt
          if-no-files-found: error

  bench-smoke:
    name: Benchmark smoke
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      # -benchtime 1x: run every benchmark once just to prove it executes and
      # does not panic or hang. Real numbers come from the nightly/bench job.
      - name: Run benchmarks (single iteration each)
        run: go test -run '^$' -bench . -benchtime 1x ./...

  cross-build:
    name: Cross build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: loong64 }
          - { goos: linux, goarch: riscv64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          # The Android ping-socket carrier (P9) must keep compiling.
          - { goos: android, goarch: arm64 }
          # 32-bit is the point of this matrix. On these GOARCHes a bare
          # uint64 is only 4-byte aligned, so a 64-bit counter that was ever
          # downgraded from atomic.Uint64 breaks at runtime. On a 64-bit
          # GOARCH the assertions in tunnel/alignment.go are no-ops, which is
          # why 386/arm/mipsle must be built here or that file protects
          # nothing. mipsle is not a release target but is the harshest
          # 32-bit alignment case, so it is the one that earns its row.
          # mips is big-endian - the one 32-bit GOARCH that would expose a
          # byte-order assumption in the wire encoding, which is what a
          # network protocol mostly is.
          - { goos: linux, goarch: 386 }
          - { goos: linux, goarch: arm }
          - { goos: linux, goarch: mipsle }
          - { goos: linux, goarch: mips }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Build
        run: go build -trimpath ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      # Vet rather than build only: vet also type-checks the _test.go files,
      # so a test that stops compiling on a rare architecture still breaks CI.
      # This is also what actually exercises tunnel/alignment.go - the
      # alignment assertions fail to compile when they trip, and nothing else
      # in CI would notice.
      - name: Vet (also compiles tests)
        run: go vet ./...
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}

  android-emulator:
    name: Android emulator (ping socket on a real kernel)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # android/amd64 needs external (cgo) linking; the runner image ships
      # the NDK, so we point CGO's CC at its clang wrapper.
      ANDROID_TEST_BIN: tunnel-android.test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build android/amd64 test binary (cgo + NDK)
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-/usr/local/lib/android/sdk/ndk-bundle}"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"
          CC="$TOOLCHAIN/x86_64-linux-android24-clang" \
          CGO_ENABLED=1 GOOS=android GOARCH=amd64 \
            go test -c -trimpath -o "$ANDROID_TEST_BIN" ./tunnel/

      # The emulator IS a real Android kernel: the ping-socket carrier's
      # device-gated tests (openPingSocket + protectFD ordering, loopback
      # round trip, the ping_group_range self-check against the real sysctl)
      # and the host-portable ping tests all execute here for real.
      #
      # The runner executes the script one physical line per `sh -c`
      # invocation: backslash continuations do NOT join lines and `$?` does
      # not survive across them. Every command therefore stays on one line,
      # and the test line is last so its exit code — propagated by adb's
      # shell v2 — decides the step. Output streams to the job log directly.
      #
      # The quoted test line is deliberate: adb shell forwards its argument to
      # the DEVICE's shell, which re-parses it. The inner double quotes keep
      # the binary path one word and the inner single quotes keep the
      # -test.run regex's `|` from being read as a pipe by the device shell.
      - name: Run tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb root
            adb wait-for-device
            adb push "$ANDROID_TEST_BIN" /data/local/tmp/
            adb shell chmod 755 /data/local/tmp/"$ANDROID_TEST_BIN"
            adb shell "/data/local/tmp/\"$ANDROID_TEST_BIN\" -test.run 'TestDevicePing|TestPing|TestCheckPingGroupRange|TestParsePingGroupRange|TestSelfFsgid' -test.timeout 10m -test.v"

  test-32bit:
    name: Test on 32-bit (${{ matrix.goarch }} via QEMU)
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # These are the GOARCHes where a bare uint64 is only 4-byte aligned, so
        # a 64-bit counter ever downgraded from atomic.Uint64 breaks here and
        # nowhere else. cross-build only COMPILES for these targets, which
        # catches the assertions in tunnel/alignment.go; this job EXECUTES the
        # code, which is the only way to catch a behavioural divergence such as
        # int(uint32) wrapping at 2^31 (TestDiscardSinkClampsHighBitLengthRequests).
        #
        # strategy.matrix must be a mapping - a bare list here is rejected as a
        # YAML error ("A sequence was not expected") even though plain YAML
        # accepts it. include: is the form the cross-build job above already
        # uses.
        include:
          - { goarch: '386', qemu: qemu-i386-static }
          - { goarch: 'arm', qemu: qemu-arm-static }
          - { goarch: 'mipsle', qemu: qemu-mipsel-static }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Install QEMU user-mode emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static
      # The flags mirror the native `test` job so the two are directly
      # comparable: -count=1 (no cache), -covermode=atomic (the coverage
      # counters are atomics, so the coverage runtime itself exercises aligned
      # 64-bit atomics on a 32-bit GOARCH), one profile for every package.
      #
      # The one deliberate omission is -race: it is not supported on any 32-bit
      # GOARCH (`go test -race` reports "-race is not supported on linux/386"),
      # so the race detector stays with the 64-bit job.
      #
      # -exec routes the cross-compiled binaries through the QEMU user-mode
      # emulator. go test appends -test.gocoverdir/-test.coverprofile to the
      # arguments it passes, so coverage is collected exactly as it would be
      # natively. CGO_ENABLED=0 makes the binaries fully static, so they need
      # no foreign libc under emulation.
      - name: Test (coverage)
        shell: bash
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go test -count=1 -test.timeout 30m \
              -coverprofile=coverage.txt -covermode=atomic \
              -exec '${{ matrix.qemu }}' ./... 2>&1 | tee test-output.txt
      # -benchtime 1x: execute every benchmark once just to prove it compiles,
      # runs and does not panic or hang on a 32-bit GOARCH. The timings are
      # meaningless under emulation, so they are not comparable with bench-smoke.
      - name: Run benchmarks (single iteration each)
        shell: bash
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go test -run '^$' -bench . -benchtime 1x -test.timeout 30m \
              -exec '${{ matrix.qemu }}' ./... 2>&1 | tee bench-output.txt
      # A short fuzz smoke on top of the fixed suite. -fuzztime bounds the
      # wall clock, and the harness writes anything it finds to the corpus on
      # disk, so a real regression is a saved input rather than a transient
      # red run. This is the only step that feeds random inputs to the parser
      # and MAC code on a 32-bit GOARCH.
      - name: Fuzz smoke (10s per target)
        shell: bash
        run: |
          set -euo pipefail
          GOOS=linux GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
            go test -run '^$' -fuzz Fuzz -fuzztime 10s -test.timeout 30m \
              -exec '${{ matrix.qemu }}' ./tunnel/ 2>&1 | tee fuzz-output.txt
      - name: Upload test output (always, for post-mortem)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 32bit-${{ matrix.goarch }}-output
          path: |
            test-output.txt
            bench-output.txt
            fuzz-output.txt
          if-no-files-found: ignore
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-32bit-${{ matrix.goarch }}
          path: coverage.txt
          if-no-files-found: error
